version: 2

sources:
  - name: raw
    description: Raw data sources from source systems
    schema: raw_data
    tables:
      - name: customers
        description: Raw customer data from CRM system
        columns:
          - name: customer_id
            description: Unique customer identifier
            tests:
              - unique
              - not_null
          - name: email
            description: Customer email address
            tests:
              - not_null
      - name: orders
        description: Raw order data from e-commerce system
        columns:
          - name: order_id
            description: Unique order identifier
            tests:
              - unique
              - not_null
          - name: customer_id
            description: Foreign key to customers table
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'customers')
                  field: customer_id
          - name: order_amount
            description: Order amount before tax and shipping
            tests:
              - not_null

